<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --display:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
      --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
    }
    body{margin:0;font-family:var(--display);}
    a{color:#ff4a17;} a:hover{color:#ffc23d;}
  </style>
</helmet>

<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:linear-gradient(#a9d3dd 0%,#cfe0d2 44%,#f4d4a0 78%,#f0bc84 100%);font-family:var(--display);color:#f1ebdd">

  <div style="position:absolute;left:0;right:0;bottom:170px;height:330px;display:flex;align-items:flex-end;gap:14px;padding:0 40px;opacity:.5">
    <div style="width:120px;height:210px;background:#6f8f9b"></div>
    <div style="width:86px;height:290px;background:#5d7f8d"></div>
    <div style="width:150px;height:160px;background:#7d9aa3"></div>
    <div style="width:104px;height:250px;background:#557684"></div>
    <div style="width:132px;height:195px;background:#6f8f9b"></div>
    <div style="width:92px;height:305px;background:#4e6e7d"></div>
    <div style="width:160px;height:150px;background:#83a0a8"></div>
    <div style="width:110px;height:235px;background:#5d7f8d"></div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(#9d8468,#7d6750)"></div>
  <div style="position:absolute;inset:0;background:#0d1017d4"></div>
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(to bottom,#0000 0 3px,#00000014 3px 4px)"></div>

  <!-- The run ends as a printed receipt: ink header, paper body, torn foot. -->
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;box-shadow:16px 16px 0 #00000038">

    <div style="background:#0d1017;padding:30px 38px 26px">
      <div style="display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:#aca596">
        <span>SIGNAL LOST — COURIER RECOVERED</span>
        <span style="color:#ff4a17">CLOSED</span>
      </div>
      <div style="height:2px;background:#ffffff1c;margin:13px 0 20px"></div>
      <div style="font-size:60px;line-height:.9;font-weight:700;font-stretch:condensed;letter-spacing:-.035em">END OF<br><span style="color:#ff4a17">THE LINE.</span></div>

      <div style="font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:#aca596;margin:26px 0 10px">DELIVERY SCORE</div>
      <div style="display:flex;gap:3px">
        <div style="position:relative;width:44px;height:60px;background:#161c27;border-top:2px solid #ffffff1f;display:grid;place-items:center;font-family:var(--mono);font-size:34px;color:#f1ebdd">0<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#0d1017"></div></div>
        <div style="position:relative;width:44px;height:60px;background:#161c27;border-top:2px solid #ffffff1f;display:grid;place-items:center;font-family:var(--mono);font-size:34px;color:#f1ebdd">2<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#0d1017"></div></div>
        <div style="position:relative;width:44px;height:60px;background:#161c27;border-top:2px solid #ffffff1f;display:grid;place-items:center;font-family:var(--mono);font-size:34px;color:#f1ebdd">4<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#0d1017"></div></div>
        <div style="position:relative;width:44px;height:60px;background:#161c27;border-top:2px solid #ffffff1f;display:grid;place-items:center;font-family:var(--mono);font-size:34px;color:#ffc23d">9<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#0d1017"></div></div>
        <div style="position:relative;width:44px;height:60px;background:#161c27;border-top:2px solid #ffffff1f;display:grid;place-items:center;font-family:var(--mono);font-size:34px;color:#ffc23d">1<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#0d1017"></div></div>
        <div style="position:relative;width:44px;height:60px;background:#161c27;border-top:2px solid #ffffff1f;display:grid;place-items:center;font-family:var(--mono);font-size:34px;color:#ffc23d">6<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#0d1017"></div></div>
      </div>
    </div>

    <div style="background:#f1ebdd;color:#0d1017;padding:22px 38px 24px">
      <div style="display:flex;gap:2px;font-family:var(--mono);font-size:10px;letter-spacing:.14em">
        <div style="flex:1;padding:11px 12px;background:#0d10170e"><div style="color:#5d5748">DISTANCE</div><div style="font-size:22px;margin-top:6px;letter-spacing:0">1 284 m</div></div>
        <div style="flex:1;padding:11px 12px;background:#0d10170e"><div style="color:#5d5748">TOKENS</div><div style="font-size:22px;margin-top:6px;letter-spacing:0">62</div></div>
        <div style="flex:1;padding:11px 12px;background:#ff4a17;color:#0d1017"><div>BEST</div><div style="font-size:22px;margin-top:6px;letter-spacing:0">24 916</div></div>
      </div>

      <div style="height:2px;background:repeating-linear-gradient(to right,#0d101733 0 6px,transparent 6px 12px);margin:22px 0 16px"></div>

      <div style="font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#5d5748;margin-bottom:12px">DELIVERY LOG</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-stretch:semi-condensed"><span>Collect 100 flux tokens</span><span style="font-family:var(--mono);font-size:11px;color:#0d1017">62 / 100</span></div>
          <div style="height:5px;background:#0d101718;margin-top:6px"><div style="width:62%;height:5px;background:#ff4a17"></div></div>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-stretch:semi-condensed"><span>Run 2 000 m in one delivery</span><span style="font-family:var(--mono);font-size:11px;color:#0d1017">1 284 / 2 000</span></div>
          <div style="height:5px;background:#0d101718;margin-top:6px"><div style="width:64%;height:5px;background:#ff4a17"></div></div>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-stretch:semi-condensed;color:#5d5748"><span>Ride the board 5 times</span><span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0d1017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>DONE</span></div>
          <div style="height:5px;background:#0d101718;margin-top:6px"><div style="width:100%;height:5px;background:#0d1017"></div></div>
        </div>
      </div>
    </div>

    <div style="background:#0d1017;padding:22px 38px 26px">
      <div style="display:flex;align-items:stretch;height:62px;box-shadow:7px 7px 0 #00000045">
        <div style="width:12px;background:repeating-linear-gradient(to bottom,#ff4a17 0 7px,#0d1017 7px 14px)"></div>
        <div style="flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#ff4a17;color:#0d1017">
          <span style="font-size:21px;font-weight:700;letter-spacing:.1em;font-stretch:condensed">RUN AGAIN</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d1017" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 7 7-7 7m7-14 7 7-7 7"/></svg>
        </div>
      </div>
      <div style="text-align:center;padding:15px 0 0;color:#aca596;font-family:var(--mono);font-size:10px;letter-spacing:.18em">BACK TO THE CITY</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
