name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The suites are dependency-free and need no browser: they cover the
      # movement physics, the pattern generator's safety invariants, and the
      # camera signal processing.
      - run: npm test
      # The build has to survive too -- it is what Vercel runs on deploy.
      - run: npm run build
